
name: Build

on:
  release:
    types: [published]
  push:

jobs:
  BuildBinary:
      runs-on: ubuntu-24.04
      permissions:
        contents: write
        packages: write
      steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          persist-credentials: false

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y jq libatomic1

      - name: Setup Node.js environment
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .node-version

      - name: Build
        run: |         
          export VERSION="`if [[ $GITHUB_REF == refs\/tags* ]]; then echo ${GITHUB_REF//refs\/tags\//}; fi`"
          if [ "$VERSION" = "" ];
          then
            export VERSION="SNAPSHOT"
          fi
          bash build.sh

      - name: Upload artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: hypergate
          path: deploy
      
      - name: Deploy to GitHub Releases
        if: github.event_name == 'release'
        run: |
          echo "${GITHUB_EVENT_PATH}"
          cat ${GITHUB_EVENT_PATH}
          releaseId=$(jq --raw-output '.release.id' ${GITHUB_EVENT_PATH})

          echo "Upload binary to $releaseId"
          filename=deploy/hypergate
          url="https://uploads.github.com/repos/${GITHUB_REPOSITORY}/releases/$releaseId/assets?name=$(basename $filename)"
          echo "Upload to $url"
          curl -L \
          -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
          -H "Content-Type: application/octet-stream" \
          --data-binary @"$filename" \
          "$url"
          
          echo "Upload hash to $releaseId"
          filename=deploy/hypergate.sha256
          url="https://uploads.github.com/repos/${GITHUB_REPOSITORY}/releases/$releaseId/assets?name=$(basename $filename)"
          echo "Upload to $url"
          curl -L \
          -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
          -H "Content-Type: text/plain" \
          --data-binary @"$filename" \
          "$url"
          

    
  BuildContainer:
      runs-on: ubuntu-24.04
      permissions:
        contents: read
        packages: write
      steps:  
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          persist-credentials: false
      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y jq
      - name: Build and push to registry
        run: |
          VERSION="snapshot"
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            VERSION="${GITHUB_REF#refs/tags/}"
          fi
          IMAGE="ghcr.io/$(echo "${GITHUB_REPOSITORY}" | tr '[:upper:]' '[:lower:]')/hypergate"
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker build -t "${IMAGE}:${VERSION}" -f docker/Dockerfile .
          docker push "${IMAGE}:${VERSION}"

  PublishRelease:
      if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
      needs: [BuildBinary, BuildContainer]
      runs-on: ubuntu-24.04
      permissions:
        actions: read
        contents: write
      steps:
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh run download "$GITHUB_RUN_ID" --name hypergate --dir deploy
          printf '%s  deploy/hypergate\n' "$(cat deploy/hypergate.sha256)" | sha256sum --check --strict
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" deploy/hypergate deploy/hypergate.sha256 --clobber
          else
            gh release create "$GITHUB_REF_NAME" deploy/hypergate deploy/hypergate.sha256 \
              --verify-tag --title "$GITHUB_REF_NAME" --generate-notes
          fi
