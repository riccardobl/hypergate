version: 1

AppDir:
  path: ./AppDir

  app_info:
    id: hypergate
    name: HyperGate
    icon: application-vnd.appimage
    version: "$VERSION"
    exec: node/bin/node
    exec_args: $APPDIR/cli.js $@

  runtime:
    env:
      LD_LIBRARY_PATH: '${APPDIR}/usr/lib/x86_64-linux-gnu'
     

AppImage:
  update-information: None
  sign-key: None
  arch: "x86_64"
